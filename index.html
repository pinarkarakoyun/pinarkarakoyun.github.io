<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pınar Karakoyun, bilgisayar mühendisliği öğrencisi. Gerçek hayattaki problemlere yazılımla çözüm üretiyor."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <title>Pınar Karakoyun</title>
    <script>
      // Kayıtlı temayı React yüklenmeden uygula (yanlış temanın bir an görünmesini önler)
      try {
        const theme = localStorage.getItem('portfolio-theme')
        if (theme === 'day' || theme === 'night') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
